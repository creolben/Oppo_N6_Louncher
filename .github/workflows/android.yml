name: Android build

# Builds on GitHub's x86_64 runners. The dev machine is ARM64 (Asahi Linux on
# M1), where Google's x86-64-only aapt2 cannot run, so APKs are produced here.
#  - pull requests: analyze, test, debug build check (no signing secrets used)
#  - pushes to main / ci/** and v* tags: signed RELEASE APK. One fixed keystore
#    (repo secrets), so each build installs over the last with `adb install -r`.
#  - v* tags additionally publish a GitHub Release.
# Download + install:
#   gh run download <run-id> -n mylauncher-release-apk
#   adb install -r app-release.apk
on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local toolchain (Flutter 3.47.7 / Dart 3.13.5); pubspec needs Dart ^3.13.1.
  FLUTTER_VERSION: "3.47.7"
  # Public SHA-256 fingerprint of the release signing cert. The build fails if
  # the APK is signed with anything else (e.g. a silent fallback to debug).
  RELEASE_CERT_SHA256: 01563ec39865c184d7a7bacc281bb330b06f09e98e24dcdc5a8544112ce675ca

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  debug-build:
    name: Debug APK build check
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # AGP 9.1 / Gradle 9.3.1; app targets JVM 17, JDK 21 builds it fine.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  release:
    name: Signed release APK
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used by the tag-triggered GitHub Release step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # run_number as versionCode keeps every CI build an upgrade of the last.
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt \
            || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mylauncher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
